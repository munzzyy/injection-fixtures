name: Release

# Builds the sdist and wheel for a v* tag and publishes them to PyPI through a
# Trusted Publisher, so no API token is stored anywhere. The publisher has to
# be configured on pypi.org first (owner munzzyy, repo injection-fixtures,
# workflow release.yml, environment pypi) or this job fails at the last step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Check the font made it into the wheel
        # The package is unusable for homoglyph and any non-ASCII text without
        # it, and a missing package-data entry is invisible until someone
        # installs the wheel. Fail here instead.
        run: |
          python -m zipfile -l dist/*.whl | grep -q "injection_fixtures/fonts/InjectionFixturesSans.ttf"
          python -m zipfile -l dist/*.whl | grep -q "injection_fixtures/py.typed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
